name: Build and test LSSE

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake --preset vs2022
      - name: Build
        run: cmake --build --preset windows-release --parallel 2
      - name: Test
        run: ctest --preset windows-release
      - name: Package
        run: python tools/package_release.py --build-dir build/windows --platform windows-x64 --configuration Release
      - uses: actions/upload-artifact@v4
        with:
          name: LSSE-windows-x64
          path: dist/LSSE-1.1.0-windows-x64.zip
          if-no-files-found: error

  macos:
    name: macOS universal
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake --preset macos-universal
      - name: Build
        run: cmake --build --preset macos-universal --parallel 2
      - name: Test
        run: ctest --preset macos-universal
      - name: Package
        run: python3 tools/package_release.py --build-dir build/macos --platform macos-universal --configuration Release
      - uses: actions/upload-artifact@v4
        with:
          name: LSSE-macos-universal-unsigned
          path: dist/LSSE-1.1.0-macos-universal.zip
          if-no-files-found: error

  linux:
    name: Linux x64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install JUCE build dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          ninja-build pkg-config xvfb
          libasound2-dev libjack-jackd2-dev ladspa-sdk
          libcurl4-openssl-dev
          libfreetype-dev libfontconfig1-dev
          libx11-dev libxcomposite-dev libxcursor-dev libxext-dev
          libxinerama-dev libxrandr-dev libxrender-dev libxi-dev
          libgl1-mesa-dev libglu1-mesa-dev mesa-common-dev
          libwebkit2gtk-4.1-dev
      - name: Configure
        run: cmake --preset linux-release
      - name: Build
        run: cmake --build --preset linux-release --parallel 2
      - name: Test
        run: xvfb-run -a ctest --preset linux-release
      - name: Package
        run: python3 tools/package_release.py --build-dir build/linux --platform linux-x64 --configuration Release
      - uses: actions/upload-artifact@v4
        with:
          name: LSSE-linux-x64
          path: dist/LSSE-1.1.0-linux-x64.zip
          if-no-files-found: error
